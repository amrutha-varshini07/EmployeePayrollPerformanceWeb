{% extends 'base.html' %}

{% block title %}Login - Employee Payroll & Performance Appraisal System{% endblock %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 0;">
    <div style="max-width: 440px; width: 100%;">
        <div class="card" style="box-shadow: var(--shadow-lg); border: 1px solid var(--border); border-radius: var(--radius-lg);">
            <div style="padding: 2.25rem 2rem 1.5rem; text-align: center; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);">
                <div class="brand-icon" style="margin: 0 auto 1rem; width: 56px; height: 56px; font-size: 1.6rem;">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 style="font-size: 1.35rem; font-weight: 800; color: var(--secondary); letter-spacing: -0.01em; margin-bottom: 0.35rem;">
                    System Authentication
                </h1>
                <p style="font-size: 0.88rem; color: var(--text-muted); line-height: 1.4;">
                    Employee Payroll and Performance Appraisal Management System
                </p>
            </div>

            <div class="card-body" style="padding: 2rem;">
                <form action="{{ url_for('login') }}" method="POST" id="loginForm" autocomplete="off">
                    <!-- Username -->
                    <div class="form-group">
                        <label for="username" class="form-label">
                            Username <span class="required" style="color: var(--danger);">*</span>
                        </label>
                        <div class="input-prefix-wrapper">
                            <span class="input-prefix">
                                <i class="fa-regular fa-user" style="color: var(--text-muted);"></i>
                            </span>
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="form-control input-with-prefix" 
                                placeholder="Enter username" 
                                value="" 
                                required 
                                autofocus
                                autocomplete="off"
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group" style="margin-bottom: 1.75rem;">
                        <label for="password" class="form-label">
                            Password <span class="required" style="color: var(--danger);">*</span>
                        </label>
                        <div class="input-prefix-wrapper">
                            <span class="input-prefix">
                                <i class="fa-solid fa-lock" style="color: var(--text-muted);"></i>
                            </span>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="form-control input-with-prefix" 
                                placeholder="Enter password" 
                                value="" 
                                required
                                autocomplete="off"
                            >
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary" id="btnLogin" style="width: 100%; padding: 0.75rem; font-size: 0.95rem;">
                        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
